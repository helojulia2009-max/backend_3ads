<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>
    
    <style>
        /* Reset simples e variáveis para facilitar mudanças de cor */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-blue: #2563eb;
            --primary-blue-hover: #1d4ed8;
            --secondary-bg: #334155;
            --secondary-bg-hover: #475569;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Estrutura do Card */
        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* Avatar / Logo */
        .avatar-placeholder {
            width: 80px;
            height: 80px;
            background-color: var(--secondary-bg);
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #64748b;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Tipografia */
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* Navegação */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Botões / Links */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
        }

        .btn:transform {
            transform: translateY(-1px);
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: #ffffff;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--primary-blue-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-bg);
            color: #f1f5f9;
            font-weight: 500;
        }

        .btn-secondary:hover {
            background-color: var(--secondary-bg-hover);
        }
    </style>
</head>
<body>

    <main class="card">
        
        <div class="avatar-placeholder">
            [Imagem]
        </div>

        <h1 class="title">Página Inicial</h1>
        
        <p class="subtitle">Bem-vindo(a) à home!</p>

        <nav class="nav-menu">
            
            <a href="/compras" class="btn btn-primary">
                <span aria-hidden="true">🛒</span> Navegar para Compras
            </a>

            <a href="/erro" class="btn btn-secondary">
                <span aria-hidden="true">⚠️</span> Página erro
            </a>

        </nav>
    </main>

</body>
</html>
